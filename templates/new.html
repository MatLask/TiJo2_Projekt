<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Event</title>
<style>
body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; }
h1 { text-align: center; color: #333; }
form { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
label { display: block; margin-top: 10px; font-weight: bold; }
input, textarea { width: 100%; padding: 8px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; }
textarea { resize: none; }
button { margin-top: 15px; padding: 10px 15px; background: #007BFF; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
button:hover { background: #0056b3; }
.error { color: red; text-align: center; }
</style>
</head>
<body>
<h1>Add New Event</h1>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="post">
    <label>Title</label>
    <input type="text" name="title" value="{{ form.title if form else '' }}" required>

    <label>Date</label>
    <input type="text" name="date" value="{{ form.date if form else '' }}" required>

    <label>Location</label>
    <input type="text" name="location" value="{{ form.location if form else '' }}">

    <label>Description</label>
    <textarea name="description" rows="4">{{ form.description if form else '' }}</textarea>

    <button type="submit">Add Event</button>
</form>
</body>
</html>
