<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Event Manager</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
h1 { text-align: center; color: #333; }
.nav { text-align: center; margin-bottom: 20px; }
.add-btn { padding: 10px 15px; background: #28a745; color: white; border-radius: 5px; text-decoration: none; }
.add-btn:hover { background: #218838; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
.card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 0 8px rgba(0,0,0,0.1); position: relative; transition: transform 0.2s; }
.card:hover { transform: translateY(-3px); }
.card.done { background: #e0e0e0; color: gray; text-decoration: line-through; }
.card h2 { margin: 0 0 10px 0; font-size: 1.2em; }
.card p { margin: 5px 0; font-size: 0.95em; }
.actions { margin-top: 10px; display: flex; gap: 5px; }
.actions a { text-decoration: none; padding: 5px 8px; border-radius: 5px; color: white; font-size: 0.85em; flex: 1; text-align: center; }
.actions a.edit { background: #007BFF; }
.actions a.edit:hover { background: #0056b3; }
.actions a.done { background: #28a745; }
.actions a.done:hover { background: #218838; }
.actions a.delete { background: #dc3545; }
.actions a.delete:hover { background: #b02a37; }
@media (max-width: 500px) {
  .cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<h1>Event Manager</h1>
<div class="nav">
    <a class="add-btn" href="{{ url_for('new_event') }}"><i class="fa fa-plus"></i> Add Event</a>
</div>
<div class="cards">
{% for event in events %}
<div class="card {% if event.done %}done{% endif %}">
    <h2>{{ event.title }}</h2>
    <p><strong>Date:</strong> {{ event.date }}</p>
    <p><strong>Location:</strong> {{ event.location }}</p>
    <p>{{ event.description }}</p>
    <div class="actions">
        <a class="edit" href="{{ url_for('edit_event', event_id=event.id) }}"><i class="fa fa-pen"></i> Edit</a>
        <a class="done" href="{{ url_for('toggle_done', event_id=event.id) }}"><i class="fa fa-check"></i> {% if event.done %}Undo{% else %}Done{% endif %}</a>
        <a class="delete" href="{{ url_for('delete_event', event_id=event.id) }}" onclick="return confirm('Are you sure?')"><i class="fa fa-trash"></i> Delete</a>
    </div>
</div>
{% endfor %}
</div>
</body>
</html>
